[catalog]
# VM Multipass de l'UC4. IP donnée par `multipass info ecom-demo`.
ecom-demo ansible_host=192.168.252.3 ansible_user=ubuntu

[catalog:vars]
ansible_python_interpreter=/usr/bin/python3
# Clé PUBLIQUE injectée dans la VM ; on se connecte avec la clé PRIVÉE correspondante.
# (jamais de clé privée en clair dans le repo — on référence juste son chemin local)
ansible_ssh_private_key_file=~/.ssh/id_ed25519
