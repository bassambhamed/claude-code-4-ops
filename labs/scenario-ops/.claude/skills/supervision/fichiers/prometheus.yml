global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alertes.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node
    static_configs:
      - targets: ["VM1_IP:9100"]
        labels: { vm: vm1 }
      - targets: ["VM2_IP:9100"]
        labels: { vm: vm2 }
      - targets: ["localhost:9100"]
        labels: { vm: monitor }

  - job_name: postgres
    static_configs:
      - targets: ["VM1_IP:9187"]
        labels: { vm: vm1 }
